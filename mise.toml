[tools]
"github:sevenc-nanashi/aviutl2-cli" = { version = "latest", bin = "au2.exe" }
"github:EmbarkStudios/cargo-about" = { version = "latest" }

# Tasks

[vars]
notice_cmd = 'cargo about generate about.hbs -o NOTICE.html'

[tasks.dev-prepare]
description = "Prepare development"
run = "au2 prepare"

[tasks."check:format"]
description = "Check format"
run = "cargo fmt --all --check"

[tasks."check:clippy"]
description = "Clippy"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.check]
description = "Check all"
depends = ["check:*"]

[tasks.notice]
description = "Generate notice file"
run = "{{ vars.notice_cmd }}"

[tasks.release-prepare]
description = "Prepare release"
shell = "pwsh -NoProfile -Command"
usage = '''
arg "<target>" help="Target version"
'''
run = '''
$ErrorActionPreference = "Stop"
$targetVersion = "{{ usage.target }}"

Write-Output "Prepare release for v$targetVersion"

cargo set-version $targetVersion
if ($LASTEXITCODE -ne 0) {
    throw "cargo set-version failed with exit code $LASTEXITCODE"
}

$aviutl2ConfigPath = Join-Path $PWD "aviutl2.toml"
$aviutl2Config = [System.IO.File]::ReadAllText($aviutl2ConfigPath)
$versionPattern = [regex]::new('(?m)^version = .*$')
$versionMatches = $versionPattern.Matches($aviutl2Config)
if ($versionMatches.Count -ne 1) {
    throw "Expected exactly one version entry in aviutl2.toml, found $($versionMatches.Count)"
}
$updatedAviutl2Config = $versionPattern.Replace(
    $aviutl2Config,
    "version = `"$targetVersion`"",
    1
)
if ($updatedAviutl2Config -ne $aviutl2Config) {
    [System.IO.File]::WriteAllText(
        $aviutl2ConfigPath,
        $updatedAviutl2Config,
        [System.Text.UTF8Encoding]::new($false)
    )
}

{{ vars.notice_cmd }}
if ($LASTEXITCODE -ne 0) {
    throw "NOTICE generation failed with exit code $LASTEXITCODE"
}

au2 release
if ($LASTEXITCODE -ne 0) {
    throw "au2 release failed with exit code $LASTEXITCODE"
}

git add Cargo.toml Cargo.lock aviutl2.toml NOTICE.html
if ($LASTEXITCODE -ne 0) {
    throw "git add failed with exit code $LASTEXITCODE"
}

git diff --cached
if ($LASTEXITCODE -ne 0) {
    throw "git diff --cached failed with exit code $LASTEXITCODE"
}

$answer = Read-Host "Commit and tag v$targetVersion? [y/N]"
if ($answer -notmatch '^[yY]$') {
    Write-Output "Canceled"
    exit 1
}

git commit -m ":bookmark: v$targetVersion"
if ($LASTEXITCODE -ne 0) {
    throw "git commit failed with exit code $LASTEXITCODE"
}

git tag -a "v$targetVersion" -m "version $targetVersion"
if ($LASTEXITCODE -ne 0) {
    throw "git tag failed with exit code $LASTEXITCODE"
}

Write-Output "and then..."
Write-Output "`$ git push origin main"
Write-Output "`$ git push origin v$targetVersion"
'''
